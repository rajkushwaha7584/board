<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Whiteboard</title>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- 🔵 TOP HORIZONTAL BAR -->
    <div class="topbar">
      <div class="toolbar-right">
        <div class="toolbar-group">
          <label>Color</label>
          <input type="color" id="color" value="#000000" />
        </div>

        <div class="toolbar-group">
          <label>Bg</label>
          <input type="color" id="bgColor" value="#ffffff" />
        </div>

        <div class="toolbar-group">
          <label>Size</label>
          <input type="range" id="lineWidth" min="1" max="24" value="2" />
          <span class="num" id="lineWidthVal">2</span>
        </div>

        <input type="text" id="boardId" placeholder="Board ID" />

        <button class="btn btn-create" id="createBoardBtn">New board</button>
        <button class="btn btn-connect" id="connectBtn">Connect</button>
        <button class="btn btn-undo" id="undoBtn">Undo</button>
        <button class="btn btn-clear" id="clearBtn">Clear</button>

        <span id="status" class="disconnected">Disconnected</span>
      </div>
    </div>

    <!-- 🔵 MAIN AREA -->
    <div class="main">
      <!-- 🟣 LEFT VERTICAL TOOLBAR -->
      <div class="sidebar">
        <button
          class="tool-btn active"
          id="toolPen"
          data-tool="freehand"
          title="Pen">
          <svg viewBox="0 0 24 24" stroke-linecap="round">
            <path d="M12 19l7-7 3 3-7 7-3-3z" />
            <path d="M18 13l-1.5-7.5L2 2l3.5 15L13 18l5-5z" />
          </svg>
        </button>

        <button class="tool-btn" id="toolLine" data-tool="line" title="Line">
          <svg viewBox="0 0 24 24"><line x1="5" y1="19" x2="19" y2="5" /></svg>
        </button>

        <button
          class="tool-btn"
          id="toolRect"
          data-tool="rectangle"
          title="Rectangle">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="1" />
          </svg>
        </button>

        <button
          class="tool-btn"
          id="toolCircle"
          data-tool="circle"
          title="Circle">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /></svg>
        </button>

        <button class="tool-btn" id="toolArrow" data-tool="arrow" title="Arrow">
          <svg viewBox="0 0 24 24">
            <line x1="5" y1="12" x2="19" y2="12" />
            <polyline points="12 5 19 12 12 19" />
          </svg>
        </button>

        <button
          class="tool-btn"
          id="toolTriangle"
          data-tool="triangle"
          title="Triangle">
          <svg viewBox="0 0 24 24">
            <path d="M12 2L2 22h20L12 2z" />
          </svg>
        </button>
        <button class="tool-btn" data-tool="star" title="Star">
          <svg viewBox="0 0 24 24">
            <polygon
              points="12 2 15 9 22 9 17 14 19 22 12 18 5 22 7 14 2 9 9 9" />
          </svg>
        </button>
        <button class="tool-btn" data-tool="curveArrow" title="Curve Arrow">
          <svg viewBox="0 0 24 24">
            <path d="M4 12c4-8 12-8 16 0" />
            <polyline points="14 6 20 12 14 18" />
          </svg>
        </button>
        <button class="tool-btn" data-tool="diamond" title="Diamond">
          <svg viewBox="0 0 24 24">
            <polygon points="12 2 22 12 12 22 2 12"/>
          </svg>
        </button>
        <button
          class="tool-btn"
          id="toolEraser"
          data-tool="eraser"
          title="Eraser">
          <svg viewBox="0 0 24 24">
            <path d="M20 20H7L3 16l10-10 7 7-7 7z" />
          </svg>
        </button>
      </div>

      <!-- ⚪ CANVAS AREA -->
      <div class="canvas-wrap">
        <canvas id="canvas"></canvas>
      </div>
    </div>

    <script src="cript.js"></script>
  </body>
</html>
